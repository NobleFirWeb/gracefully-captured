<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#f4f1ed"/>

  <!-- GS letters in a serif style matching the navbar -->
  <text
    x="32"
    y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="400"
    letter-spacing="4"
    fill="#623e2a"
    text-anchor="middle"
    dominant-baseline="auto"
  >GS</text>

  <!-- Thin bottom rule (echoes the nav underline accent) -->
